<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 1020" role="img" aria-labelledby="title desc">
  <title id="title">Muestra de estilo verde pastel para la marca de traslado de mascotas</title>
  <desc id="desc">Muestra conceptual con navegación blanca redondeada, fondo verde claro, titular oscuro redondeado, botón verde, espacio reservado para fotografía propia, tarjetas pastel y colores de la paleta.</desc>
